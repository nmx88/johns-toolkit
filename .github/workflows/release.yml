name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer (for the code-analysis check)
        shell: powershell
        run: |
          try {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          } catch { Write-Host "PSScriptAnalyzer not installed: $($_.Exception.Message) (that check will be skipped)" }

      - name: Tests (a release is only published if every test passes)
        shell: powershell
        run: .\tests\Run-Tests.ps1

      - name: Build (syntax check, exe, zips)
        shell: powershell
        run: .\build\Build-Release.ps1

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($tag))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "John's Toolkit $tag" }
          $notes += "`n`n---`n**Download:** ``JohnsToolkit-$tag-with-exe.zip`` (with JohnsToolkit.exe) or ``JohnsToolkit-$tag.zip`` (scripts only). Check files against ``SHA256SUMS.txt``."
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(Get-ChildItem dist\*.zip, dist\SHA256SUMS.txt | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw 'No files in dist\ to publish.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # the release already exists (re-run or re-pushed tag): replace the files and notes
            gh release upload $tag @files --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag @files --title "John's Toolkit $tag" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed ($LASTEXITCODE)" }
